# Venue Ninja — Render Blueprint (web service + Postgres)
#
# Historical reference: this file documents the original Render deployment layout
# (Docker web service + managed PostgreSQL). It is retained for architecture and
# deployment review. The current public portfolio frontend uses bundled static data
# and does not require applying this blueprint or hosting this API.
#
# If you choose to apply it manually: Render Dashboard → Blueprints → this repo.
# Applying provisions cloud resources; it is not part of the static demo workflow.

databases:
  - name: venue-ninja-db
    plan: free
    region: virginia

services:
  - type: web
    name: venue-ninja
    runtime: docker
    plan: free
    region: virginia
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: venue-ninja-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: venue-ninja-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: venue-ninja-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: venue-ninja-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: venue-ninja-db
          property: password
